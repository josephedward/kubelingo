id: "ckad-q22-api-gateway"
topic: services
question: |
  In the namespace 'platform', create a Deployment named 'api-gateway' with exactly 2 replicas.
  Each Pod must run a single container named 'gateway' using the image 'nginx:1.25-alpine'.
  Label the Pod template with 'app=api' and 'tier=edge'.

  Also create a ClusterIP Service named 'api-gateway-svc' that selects Pods with labels 'app=api' and 'tier=edge'.
  The Service must listen on port 8080 and forward to containerPort 80.

  Configure both a readinessProbe and livenessProbe for the container to perform HTTP GET requests to path '/healthz' on port 80,
  with 'periodSeconds: 10' for each probe.

  All resource names, labels, image, ports, and probe settings are specified above and must match exactly.
source: "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"
suggested_answer: |
  ---
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: api-gateway
    namespace: platform
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: api
        tier: edge
    template:
      metadata:
        labels:
          app: api
          tier: edge
      spec:
        containers:
        - name: gateway
          image: nginx:1.25-alpine
          ports:
          - name: http
            containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 10
  ---
  apiVersion: v1
  kind: Service
  metadata:
    name: api-gateway-svc
    namespace: platform
  spec:
    type: ClusterIP
    selector:
      app: api
      tier: edge
    ports:
    - name: http
      port: 8080
      targetPort: 80
