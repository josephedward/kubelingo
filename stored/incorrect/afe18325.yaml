question: What command would you use to create a PersistentVolumeClaim named 'my-pvc'
  in the 'default' namespace with a storage request of 5Gi and access mode set to
  'ReadWriteOnce'?
suggested_answer: kubectl create pvc my-pvc --namespace=default --storage=5Gi --access-mode=ReadWriteOnce
