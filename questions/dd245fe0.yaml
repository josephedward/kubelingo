type: Manifests
topic: Kubernetes Deployment
question: Create a Kubernetes Deployment manifest for an application named 'my-app'
  with the image 'my-app-image:latest', running on port 8080, and with 3 replicas.
suggested_answer: |-
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: my-app
  spec:
    replicas: 3
    selector:
      matchLabels:
        app: my-app
    template:
      metadata:
        labels:
          app: my-app
      spec:
        containers:
        - name: my-app-container
          image: my-app-image:latest
          ports:
          - containerPort: 8080
source: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
