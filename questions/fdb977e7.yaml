type: Manifests
topic: jobs_cronjobs
question: Create a CronJob named 'my-cronjob' that runs a job every 5 minutes. The
  job should use the image 'my-image:latest', and it should run the command 'echo
  Hello World'. The job should have a successful completion history limit of 3 and
  a failed completion history limit of 1.
suggested_answer: |-
  apiVersion: batch/v1
  kind: CronJob
  metadata:
    name: my-cronjob
  spec:
    schedule: "*/5 * * * *"
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 1
    jobTemplate:
      spec:
        template:
          spec:
            containers:
            - name: my-container
              image: my-image:latest
              command: ["echo", "Hello World"]
            restartPolicy: OnFailure
